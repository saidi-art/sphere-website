<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today - Sphere by KubeAI</title>
<meta name="description" content="Today on Sphere: the date, the time, and the day's colour.">
<link rel="canonical" href="https://sphere.kubeai.info/today/">
<link rel="icon" type="image/png" href="../assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/sphere.css">
<link rel="stylesheet" href="../assets/css/today.css">
<style>
  .brand-by{font-weight:400;font-size:.85rem;color:var(--ink2)}
  .site-foot{border-top:1px solid var(--hair);margin-top:40px;padding:20px 0 32px;color:var(--ink2);font-size:.85rem}
  .site-foot p{margin:0}
  .site-foot a{color:var(--link)}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="../"><img src="../assets/img/icon-512.png" alt="" width="32" height="32">Sphere&nbsp;<span class="brand-by">by KubeAI</span></a>
    <nav class="site-nav" aria-label="Site">
      <a href="../app/">About Sphere</a>
      <a href="../privacy/">Privacy policy</a>
      <a class="btn" href="../#join">Join the list</a>
    </nav>
  </div>
</header>
<main>
  <section class="today" aria-label="Today on Sphere: date, time and the day's colour">
    <div class="today-date">
      <div>
        <span class="t-weekday">Today</span>
        <span class="t-datelong"></span>
      </div>
      <div class="t-park">
        <div class="t-park-circle"></div>
        <span>Park your sphere here</span>
      </div>
    </div>
    <div class="today-clockwrap">
      <svg class="t-dial" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Today's clock"></svg>
    </div>
    <div class="today-time">
      <span class="t-time">--:--:--</span>
      <span class="t-tz"></span>
    </div>
    <div class="today-palette">
      <span class="t-label">Today's palette</span>
      <div class="t-chips"></div>
    </div>
    <div class="today-meta">
      <span class="t-dayhue"></span>
      <span class="t-testlabel"></span>
    </div>
    <div class="t-streak" aria-hidden="true"></div>
    <noscript><p class="t-tz" style="text-align:center">Enable JavaScript to see today's live clock and colour.</p></noscript>
  </section>
</main>
<footer class="site-foot">
  <div class="wrap">
    <p>&copy; 2026 KubeAI &middot; <a href="mailto:saidi@kubeai.info">saidi@kubeai.info</a> &middot; <a href="../app/">About Sphere</a> &middot; <a href="../privacy/">Privacy policy</a> &middot; <a href="../deletion/">Delete your account</a> &middot; <a href="../waitlist-notice/">Waiting-list notice</a></p>
  </div>
</footer>
<script src="../assets/js/sphere.js" defer></script>
<script src="../assets/js/today.js" defer></script>
</body>
</html>
